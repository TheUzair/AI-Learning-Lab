[project]
name = "04-ml-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheUzair", email = "ujertheunique@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "dotenv>=0.9.9",
    "fastapi>=0.162.2",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
04-ml-api = "04_ml_api:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
