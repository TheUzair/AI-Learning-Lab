services:
  - type: web
    name: web-chatbot-api
    runtime: python
    rootDir: 02-web-chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_chatbot.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
