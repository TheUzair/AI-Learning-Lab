[project]
name = "web-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheUzair", email = "ujertheunique@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
web-chatbot = "web_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
[tool.fastapi]
entrypoint = "web_chatbot.main:app"
